[project]
name = "sunny"
version = "0.1.0"
description = "Sunny V2 — personal AI assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "watchfiles>=1.0",
    "python-frontmatter>=1.1",
    "shortuuid>=1.0",
    "anthropic>=0.70",
    "pyyaml>=6.0",
    "icalendar>=5.0",
    "caldav>=1.3",
    "garminconnect>=0.2",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "youtube-transcript-api>=0.6",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Semantic search backend (sunny.index.vector) — not wired to an embedding writer yet
semantic = ["sqlite-vec>=0.1", "fastembed>=0.4"]
# Voice pipeline (sunny.tools.voice_pipeline) — not exposed through any route yet
voice = ["faster-whisper>=1.0", "edge-tts>=6.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
